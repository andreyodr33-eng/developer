<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Monobank QR Генератор</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 40px; }
    input, button { padding: 10px; font-size: 18px; margin-top: 10px; width: 250px; }
    #qrcode { margin-top: 20px; }
  </style>
</head>
<body>

<h2>Генератор QR для Monobank</h2>

<input type="number" id="amount" placeholder="Сума у гривнях">
<br>
<button id="generateBtn">Згенерувати QR</button>

<div id="qrcode"></div>

<!-- Подключаем библиотеку через CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const btn = document.getElementById("generateBtn");

  btn.addEventListener("click", function() {
    const amount = document.getElementById("amount").value;
    const card = "4441114407876992"; // Ваша карта Monobank

    if (!amount || amount <= 0) {
      alert("Введіть правильну суму!");
      return;
    }

    const paymentLink = `monobank://send?amount=${amount}&card=${card}`;

    const qrDiv = document.getElementById("qrcode");
    qrDiv.innerHTML = "";

    new QRCode(qrDiv, {
      text: paymentLink,
      width: 256,
      height: 256,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  });
});
</script>

</body>
</html>
