<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сканер QR</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f5f5f5;
}
#container {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    min-width: 300px;
}
#cardNumber { 
    font-size: 22px;
    margin-bottom: 20px;
    word-break: break-all;
}
button {
    padding: 12px 25px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
}
button:hover {
    background-color: #45a049;
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
}
#sellerInfoBlock {
    margin-bottom: 20px;
    padding: 15px;
    background: #fff8dc;
    border-radius: 10px;
    font-weight: bold;
}
</style>
</head>
<body>

<div id="container">
    <div id="sellerInfoBlock"></div>
    <div id="cardNumber"></div>
    <button>Скопіювати</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

    // Получаем данные из URL
    const params = new URLSearchParams(window.location.search);
    const cardNumber = params.get('data') || "Номер не найден";
    const sellerPage = params.get('seller');

    // Показываем номер карты
    document.getElementById("cardNumber").innerText = cardNumber;

    // Список продавцов
    const sellers = {
        "1": "Владимирский рынок — место 1",
        "2": "Владимирский рынок — место 2",
        "3": "Житний рынок — место 3",
        "4": "Pынок Светлый - палатка N7"
    };

    const sellerInfoBlock = document.getElementById("sellerInfoBlock");

    // Копирование номера карты
    function copyCard() {
        navigator.clipboard.writeText(cardNumber).catch(err => console.error(err));
    }

    // Голосовая инструкция
    function speakInstruction() {
        speechSynthesis.cancel();
        const instruction = new SpeechSynthesisUtterance(
            "Зайдите в приложение банка и вставьте скопированный номер карты"
        );
        instruction.lang = "ru-RU";
        instruction.rate = 0.9;
        speechSynthesis.speak(instruction);
    }

    // Показ информации продавца
    function showSellerInfo() {
        if (sellerPage && sellers[sellerPage]) {
            sellerInfoBlock.innerText = sellers[sellerPage];
        } else {
            sellerInfoBlock.innerText = "Информация о продавце не найдена";
        }
    }

    // Обработчик кнопки
    const copyButton = document.querySelector("button");
    copyButton.addEventListener("click", function() {
        copyCard();
        speakInstruction();
        showSellerInfo();
    });

});
</script>

</body>
</html>
