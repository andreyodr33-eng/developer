<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Оплата</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body {
    font-family: Arial;
    text-align: center;
    background: #f5f5f5;
}
.box {
    background: white;
    padding: 20px;
    margin: 30px auto;
    width: 320px;
    border-radius: 10px;
}
input, button {
    padding: 10px;
    margin-top: 10px;
    font-size: 16px;
}
</style>
</head>
<body>

<div class="box">
<h2>Оплата товару</h2>
<p>Введіть суму:</p>
<input type="number" id="amount" placeholder="Наприклад 250">
<br>
<button onclick="generateQR()">Створити QR</button>

<div id="qrcode" style="margin-top:20px;"></div>
</div>

<script>
function generateQR() {
    let amount = document.getElementById("amount").value;
    let iban = "UA093220010000026208340026552"; // ваш IBAN
    let paymentLink = `https://send.monobank.ua/jar/?iban=${iban}&amount=${amount}`;
    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), paymentLink);
}
</script>

</body>
</html>
