<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оплата карткою</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f5f5f5;
}
#container {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}
#cardNumber { 
    font-size: 22px;
    margin-bottom: 20px;
    word-break: break-all;
}
button {
    padding: 12px 25px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
}
 button:hover {
    background-color: #45a049;
    transform: translateY(-3px) scale(1.05);
     box-shadow: 0 8px 20px rgba(0,0,0,0.3);
     background: linear-gradient(135deg, #ff758c, #ff7eb3);
 }

</style>
</head>
<body>

<div id="container">
    <div id="cardNumber"></div>
    <button onclick="copyCard()">Скопіювати</button>
</div>

<script>
    // Получаем номер карты/IBAN из параметра URL
    const params = new URLSearchParams(window.location.search);
    const cardNumber = params.get('data') || "Номер не найден";

    // Показываем на странице
    document.getElementById("cardNumber").innerText = cardNumber;

    // Копировать в буфер
    function copyCard() {
        navigator.clipboard.writeText(cardNumber).then(() => {
            alert("Номер скопійовано!");
        });
    }
</script>
<script>
function speakCardNumber(text) {

    speechSynthesis.cancel(); // очищаем очередь

    // 1️⃣ Голосовая инструкция
    let instruction = new SpeechSynthesisUtterance(
        "Зайдіть у свій банк та введіть скопійований номер"
    );
    instruction.lang = "uk-UA";
    instruction.rate = 0.9;

    // 2️⃣ После инструкции читаем цифры
    instruction.onend = function () {

        let digits = text.split("").join(" ");

        let numbersSpeech = new SpeechSynthesisUtterance(digits);
        numbersSpeech.lang = "uk-UA";
        numbersSpeech.rate = 0.85;

        speechSynthesis.speak(numbersSpeech);
    };

    speechSynthesis.speak(instruction);
}

// Перехватываем кнопку
document.querySelector("button").addEventListener("click", function () {

    const number = document.getElementById("cardNumber").innerText;

    if (number && number !== "Номер не найден") {
        speakCardNumber(number);
    }

});
</script>

</body>

</html>
