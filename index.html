<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сканер QR</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #000;
    color: #fff
}
#container {
    background: #111;
    padding: 25px;
    border: 2px solid #00ff99;
    border-radius: 15px;
    text-align: center;
    box-sizing: border-box
    min-width: 300px;
}
#cardNumber { 
    font-size: 22px;
    margin-bottom: 20px;
    word-break: break-all;
    color: #fff;
}
button {
    padding: 12px 25px;
    font-size: 18px;
    border-radius: 8px;
    border: 2px solid #00ff99;
    background-color: #000;
    color: #00ff99;
    cursor: pointer;
    transition: 0,2s;
}
button:hover {
    background-color: #00ff99;
    color: #000;
    
    
}
#sellerInfoBlock {
    margin-bottom: 20px;
    padding: 15px;
    background: #111;
    border: 2px solid #00ff99;
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    text-align: left;
    line-height: 1.5;
    display: none;
}
</style>
</head>
<body>

<div id="container">
    <div id="sellerInfoBlock"></div>
    <div id="cardNumber"></div>
    <button>Скопіювати</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

    // Получаем данные из URL
    const params = new URLSearchParams(window.location.search);
    const cardNumber = params.get('data') || "Номер не найден";
    const sellerPage = params.get('seller');

    document.getElementById("cardNumber").innerText = cardNumber;

    // Список продавцов с телефоном и скидками
    const sellers = {
        "1": {
            market: "Владимирский рынок",
            place: "место 17",
            phone: "0000000000"
            discount: "Скидки постоянным покупателям"
        },
        "2": {
            market: "Владимирский рынок",
            place: "Овощи домашние, соленья",
            phone: "0000000000",
            discount: "Скидки постоянным клиентам"
        },
        "3": {
            market: "Житний рынок",
            place: "место 3",
            phone: "+380501133445",
            discount: "Скидка 7% на свежие овощи"
        }
    };

    const sellerInfoBlock = document.getElementById("sellerInfoBlock");

    // Копирование номера карты
    function copyCard() {
        navigator.clipboard.writeText(cardNumber).catch(err => console.error(err));
    }

    // Голосовая инструкция
    function speakInstruction() {
        speechSynthesis.cancel();
        const instruction = new SpeechSynthesisUtterance(
            "Зайдите в приложение банка и вставьте скопированный номер карты"
        );
        instruction.lang = "ru-RU";
        instruction.rate = 0.9;
        speechSynthesis.speak(instruction);
    }

    // Показ информации продавца
    function showSellerInfo() {
        if (sellerPage && sellers[sellerPage]) {
            const s = sellers[sellerPage];
            sellerInfoBlock.innerHTML = `
                <div><strong>${s.market} — ${s.place}</strong></div>
                <div>Телефон: ${s.phone}</div>
                <div>${s.discount}</div>
            `;
            sellerInfoBlock.style.display = "block";
        } else {
            sellerInfoBlock.innerText = "Информация о продавце не найдена";
            sellerInfoBlock.style.display = "block";
        }
    }

    // Обработчик кнопки
    document.querySelector("button").addEventListener("click", function() {
        copyCard();
        speakInstruction();
        showSellerInfo();
    });

});
</script>

</body>
</html>
