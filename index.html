<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оплата карткою</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f5f5f5;
}
#container {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}
#cardNumber { 
    font-size: 22px;
    margin-bottom: 20px;
    word-break: break-all;
}
button {
    padding: 12px 25px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
}
 button:hover {
    background-color: #45a049;
    transform: translateY(-3px) scale(1.05);
     box-shadow: 0 8px 20px rgba(0,0,0,0.3);
     background: linear-gradient(135deg, #ff758c, #ff7eb3);
 }

</style>
</head>
<body>

<div id="container">
    <div id="cardNumber"></div>
    <button id="copyBtn">Скопіювати</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const cardNumber = params.get('data') || "Номер не найден";
const sellerPage = params.get('seller');

document.getElementById("cardNumber").innerText = cardNumber;

// Копирование
function copyCard() {
    navigator.clipboard.writeText(cardNumber);
}

// Голос
function speakInstruction() {
    speechSynthesis.cancel();
    let instruction = new SpeechSynthesisUtterance(
        "Зайдите в приложение банка и вставьте скопированный номер карты"
    );
    instruction.lang = "ru-RU";
    instruction.rate = 0.9;
    speechSynthesis.speak(instruction);
}

// Показ информации продавца
function showSellerInfo() {

    if (!sellerPage) return;

    fetch("https://andreyodr33-eng.github.io/TradeWin/?page=" + sellerPage)
    .then(response => response.text())
    .then(html => {

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        const sellerCard = doc.getElementById("card");

        if (sellerCard) {

            // Проверяем чтобы блок не дублировался
            if (!document.getElementById("sellerInfoBlock")) {

                const infoBlock = document.createElement("div");
                infoBlock.id = "sellerInfoBlock";
                infoBlock.style.marginBottom = "20px";
                infoBlock.style.padding = "15px";
                infoBlock.style.background = "#fff8dc";
                infoBlock.style.borderRadius = "10px";
                infoBlock.innerHTML = sellerCard.innerHTML;

                const container = document.getElementById("container");
                container.insertBefore(infoBlock, container.firstChild);
            }
        }

    })
    .catch(err => console.log("Ошибка загрузки продавца:", err));
}

// Обработчик кнопки
document.querySelector("button").addEventListener("click", function() {
    copyCard();
    speakInstruction();
    showSellerInfo();
});
</script>
</body>
</html>
